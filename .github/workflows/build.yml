name: Build ColorOSCC

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid xz make dpkg

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/*.sdk "$HOME/theos/sdks/"
          ls "$HOME/theos/sdks"

      - name: Build (rootless)
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make clean
          make package FINALPACKAGE=1
          mkdir -p out && cp packages/*.deb out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ColorOSCC-deb
          path: out/**/*.deb

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/**/*.deb
